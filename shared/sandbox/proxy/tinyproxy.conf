Port 8888
Listen 0.0.0.0
Timeout 600
LogLevel Notice
MaxClients 50
# Docker bridge and internal networks only.
Allow 172.16.0.0/12
Allow 10.0.0.0/8
# Deny by default; a request passes only when its host matches a line of the allowlist.
FilterDefaultDeny Yes
FilterType ere
Filter "/etc/tinyproxy/allowlist"
ConnectPort 443
